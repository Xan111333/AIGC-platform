version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: aigc-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aigc_platform}
      MYSQL_USER: ${MYSQL_USER:-aigc_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aigc_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - aigc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aigc-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aigc-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aigc-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - aigc-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: aigc-backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-aigc_user}:${MYSQL_PASSWORD:-aigc_password}@mysql:3306/${MYSQL_DATABASE:-aigc_platform}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:-aigc-secret-key}
      - ENVIRONMENT=production
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QIANFAN_AK=${QIANFAN_AK:-}
      - QIANFAN_SK=${QIANFAN_SK:-}
      - CORS_ORIGINS=${PRODUCTION_DOMAIN:-*}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aigc-network
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
    container_name: aigc-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aigc-network

networks:
  aigc-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
  uploads_data: